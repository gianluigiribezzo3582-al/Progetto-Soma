<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Soma">
  <!-- Open amber arc: the "wave" being held -->
  <path d="M 96 26 A 50 50 0 1 1 22 30" fill="none" stroke="#F2B27A" stroke-width="3" stroke-linecap="round"/>
  <!-- Rim of the pebble -->
  <circle cx="60" cy="60" r="34" fill="none" stroke="#9AA05A" stroke-width="13"/>
  <!-- Tactile surface -->
  <circle cx="60" cy="60" r="27.5" fill="#FBF8F2"/>
  <g fill="#8A8D86">
    <circle cx="60" cy="38" r="1.4"/><circle cx="71" cy="41" r="1.4"/><circle cx="79" cy="49" r="1.4"/>
    <circle cx="82" cy="60" r="1.4"/><circle cx="79" cy="71" r="1.4"/><circle cx="71" cy="79" r="1.4"/>
    <circle cx="60" cy="82" r="1.4"/><circle cx="49" cy="79" r="1.4"/><circle cx="41" cy="71" r="1.4"/>
    <circle cx="38" cy="60" r="1.4"/><circle cx="41" cy="49" r="1.4"/><circle cx="49" cy="41" r="1.4"/>
  </g>
  <!-- Dial with amber light ring -->
  <circle cx="60" cy="60" r="13" fill="none" stroke="#F2B27A" stroke-width="2"/>
  <circle cx="60" cy="60" r="10.5" fill="#D9DAD6"/>
</svg>
